name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck 0.11.0 (pinned)
        run: |
          scver=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${scver}/shellcheck-v${scver}.linux.x86_64.tar.xz" -o /tmp/sc.tar.xz
          sudo tar -xJf /tmp/sc.tar.xz -C /usr/local --strip-components=1 "shellcheck-v${scver}/shellcheck"
          shellcheck --version | head -2

      - name: Syntax (bash -n)
        run: |
          bash -n stack-manager.sh
          bash -n stack-manager-update.sh

      - name: shellcheck
        run: shellcheck --severity=warning stack-manager.sh stack-manager-update.sh

      - name: Сборка из src/ синхронна с закоммиченным stack-manager.sh
        run: |
          cp stack-manager.sh /tmp/committed.sh
          ./build.sh
          cmp /tmp/committed.sh stack-manager.sh

  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION == STACK_MANAGER_VERSION == последняя запись CHANGELOG
        run: |
          v_file=$(tr -d '[:space:]' < VERSION)
          v_script=$(grep -m1 -E '^STACK_MANAGER_VERSION="' stack-manager.sh | sed -E 's/^STACK_MANAGER_VERSION="([^"]+)"/\1/')
          # последняя релизная запись CHANGELOG (секция [Нереализовано] — накопитель и не версия)
          v_changelog=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')
          echo "VERSION=${v_file} | STACK_MANAGER_VERSION=${v_script} | CHANGELOG=${v_changelog}"
          if [[ "$v_file" != "$v_script" || "$v_script" != "$v_changelog" ]]; then
            echo "::error::Версии расходятся — синхронизируйте VERSION, STACK_MANAGER_VERSION и CHANGELOG"
            exit 1
          fi

      - name: У последней записи CHANGELOG существует тег (иначе релиз не соберётся)
        run: |
          git fetch --tags --force
          v_changelog=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')
          if ! git tag -l "v${v_changelog}" | grep -q .; then
            echo "::error::Тег v${v_changelog} не существует — запушьте тег, workflow «Build release package» опубликует релиз"
            exit 1
          fi
