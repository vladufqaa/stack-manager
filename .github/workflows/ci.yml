name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Syntax (bash -n)
        run: |
          bash -n stack-manager.sh
          bash -n stack-manager-update.sh

      - name: shellcheck
        run: shellcheck --severity=warning stack-manager.sh stack-manager-update.sh
