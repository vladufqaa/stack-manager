name: Build release package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and script
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "${GITHUB_REF_NAME}"
          bash -n stack-manager.sh
          bash -n stack-manager-update.sh
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          pkg="stack-manager-$version"
          mkdir -p "dist/$pkg"
          cp stack-manager.sh VERSION README.md stack-manager-update.sh "dist/$pkg/"
          cp -r assets "dist/$pkg/"
          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          sha256sum "dist/$pkg.tar.gz" > "dist/$pkg.tar.gz.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/stack-manager-*.tar.gz
            dist/stack-manager-*.tar.gz.sha256
